document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-spacing:.1em;cursor:pointer\">{{ l.code }}<\u002Fdiv>\n      <\u002Fsc-for>\n      <div sc-camel-on-click=\"{{ toggleLang }}\" style=\"width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#948E85;font-size:16px;cursor:pointer\" style-hover=\"color:#EA4318\">+<\u002Fdiv>\n      <div style=\"width:1px;height:20px;background:#383838;margin:0 4px\"><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#CFCAC1;padding-right:6px\">{{ clock }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ langOpen }}\">\n      <div style=\"width:520px;background:#2A2A2A;border:1px solid #383838;border-radius:16px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)\">\n        <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#948E85\">Idioma<\u002Fdiv>\n        <div style=\"margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n          <sc-for list=\"{{ langOptions }}\" as=\"l\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ l.pick }}\" style=\"border:1px solid {{ l.border }};background:{{ l.bg }};border-radius:12px;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer\">\n              <div style=\"font-size:16px;font-weight:600;color:{{ l.fg }}\">{{ l.name }}<\u002Fdiv>\n              <div style=\"font-size:12px;letter-spacing:.1em;color:{{ l.codeColor }}\">{{ l.code }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showChrome }}\">\n    <div style=\"height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #383838;background:#262626\">\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        <div sc-camel-on-click=\"{{ onBack }}\" style=\"width:52px;height:52px;border:1px solid #454545;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#2E2E2E\" style-hover=\"border-color:#EA4318\">\n          <div style=\"width:12px;height:12px;border-left:2px solid #CFCAC1;border-bottom:2px solid #CFCAC1;transform:rotate(45deg);margin-left:4px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:3px\">\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;line-height:1\">{{ headerTitle }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948E85;letter-spacing:.1em;text-transform:uppercase\">{{ headerSub }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        \n        <div style=\"text-align:right\">\n          <div style=\"font-size:14px;font-weight:600\">{{ userName }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948E85;font-family:'IBM Plex Mono',monospace\">{{ userDoc }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:44px;height:44px;border-radius:50%;background:#EA4318;color:#1E1E1E;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px\">{{ userInitials }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showSteps }}\">\n    <div style=\"flex:none;height:54px;display:flex;align-items:center;padding:0 28px;background:#232323;border-bottom:1px solid #333333\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding-right:24px;margin-right:24px;border-right:1px solid #383838\">\n          <div style=\"width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:{{ s.bg }};color:{{ s.fg }}\">{{ s.n }}<\u002Fdiv>\n          <div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:{{ s.tone }}\">{{ s.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- IDLE -->\n  <sc-if value=\"{{ isIdle }}\" hint-placeholder-val=\"{{ true }}\">\n    <div sc-camel-on-click=\"{{ goAuth }}\" style=\"flex:1;display:flex;cursor:pointer;background:linear-gradient(180deg,#1E1E1E 0%,#212121 100%)\">\n      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:60px 56px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div sc-camel-on-click=\"{{ onLogoTap }}\" style=\"align-self:flex-start;cursor:pointer\">\n            <img src=\"0b565d83-86eb-4d57-be63-4a6d1c621a74\" alt=\"Toolsync\" style=\"height:72px;width:auto;max-width:none;flex:none;object-fit:contain;display:block;margin-left:-4px\">\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#948E85;letter-spacing:.18em;text-transform:uppercase\">Armário inteligente · Stand de tiro<br><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:88px;line-height:.95;text-transform:uppercase;text-wrap:balance\">Retire sua<br>arma e<br><span style=\"color:#EA4318\">munição<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:19px;color:#B3ADA3;margin-top:24px;max-width:440px;line-height:1.5\">Autoatendimento com biometria, pagamento na tela e liberação automática do compartimento.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:18px\">\n          <div style=\"padding:22px 40px;background:#EA4318;color:#1E1E1E;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;animation:glow 2.6s ease-in-out infinite\">Toque para começar<\u002Fdiv>\n          <div style=\"font-size:14px;color:#7A7 case;color:#7A736A\">Status do armário<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ idleStats }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px solid #333333\">\n              <span style=\"color:#B3ADA3;font-size:15px\">{{ st.label }}<\u002Fspan>\n              <span style=\"font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:600;color:{{ st.color }}\">{{ st.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;font-size:13px;color:#5C5750;line-height:1.6\">Toda movimentação é registrada com data, hora, item e responsável.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- AUTH -->\n  <sc-if value=\"{{ isAuth }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px\">\n      <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:600;letter-spacing:.05em;text-transform:uppercase\">Identifique-se<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ onScan }}\" style=\"width:236px;height:236px;border-radius:50%;border:2px solid #454545;background:#272727;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer\">\n        <div style=\"position:absolute;inset:0;border-radius:50%;border:2px solid #EA4318;animation:scanPulse 2s ease-out infinite\"><\u002Fdiv>\n        <svg width=\"96\" height=\"116\" sc-camel-view-box=\"0 0 44 52\" fill=\"none\" stroke=\"#EA4318\" stroke-width=\"2\" stroke-linecap=\"round\">\n          <path d=\"M22 3C12 3 5 10 5 20v8\"><\u002Fpath><path d=\"M39 26v-6c0-9-7-15-17-15-4 0-7 1-10 3\"><\u002Fpath>\n          <path d=\"M12 34v-14a10 10 0 0 1 20 0v12\"><\u002Fpath><path d=\"M19 40V20a3 3 0 0 1 6 0v20\"><\u002Fpath>\n          <path d=\"M6 38c1 5 2 8 4 11\"><\u002Fpath><path d=\"M33 40c-1 4-2 7-4 9\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:18px;color:#B3ADA3\">{{ authMsg }}<\u002Fdiv>\n      <div style=\"width:300px;height:5px;background:#343434;border-radius:3px;overflow:hidden\">\n        <sc-if value=\"{{ scanning }}\"><div style=\"height:100%;background:#EA4318;animation:barFill 1.1s linear forwards\"><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#5C5750\">Problemas com a digital? Procure o atendimento no balcão.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- MENU -->\n  <sc-if value=\"{{ isMenu }}\">\n    <div style=\"flex:1;padding:48px 52px;display:flex;flex-direction:column\">\n      <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:600;text-transform:uppercase;letter-spacing:.03em\">O que você precisa hoje?<\u002Fdiv>\n      <div style=\"font-size:17px;color:#948E85;margin-top:8px\">{{ menuSub }}<\u002Fdiv>\n      <div style=\"margin-top:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1\">\n        <div sc-camel-on-click=\"{{ goPickup }}\" style=\"border:1px solid #383838;border-radius:16px;background:#2A2A2A;padding:34px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer\" style-hover=\"border-color:#EA4318;background:#3A3A3A\">\n          <div style=\"width:62px;height:62px;border-radius:12px;background:#EA4318;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E1E1E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"M7 10l5 5 5-5\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:33px;font-weight:600;text-transform:uppercase;letter-spacing:.04em\">Retirar arma<\u002Fdiv>\n            <div style=\"font-size:16px;color:#948E85;margin-top:8px;line-height:1.5\">Armamento, munição, pagamento e liberação do compartimento.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goAmmoOnly }}\" style=\"border:1px solid #383838;border-radius:16px;background:#2A2A2A;padding:34px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer\" style-hover=\"border-color:#EA4318;background:#3A3A3A\">\n          <div style=\"width:62px;height:62px;border-radius:12px;border:1px solid #565656;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EA4318\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"7\" width=\"16\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M9 7V5a3 3 0 0 1 6 0v2\"><\u002Fpath><path d=\"M9 13h6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:33px;font-weight:600;text-transform:uppercase;letter-spacing:.04em\">Comprar munição<\u002Fdiv>\n            <div style=\"font-size:16px;color:#948E85;margin-top:8px;line-height:1.5\">Munição avulsa para quem já está com a arma em mãos.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goReturn }}\" style=\"border:1px solid #EA4318;border-radius:16px;background:#2A1710;padding:34px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer\" style-hover=\"background:#35201A\">\n          <div style=\"width:62px;height:62px;border-radius:12px;border:1px solid #EA4318;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EA4318\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21V9\"><\u002Fpath><path d=\"M7 14l5-5 5 5\"><\u002Fpath><path d=\"M4 4h16\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:33px;font-weight:600;text-transform:uppercase;letter-spacing:.04em\">Devolução<\u002Fdiv>\n            <div style=\"font-size:16px;color:#E8A491;margin-top:8px;line-height:1.5\">Devolva a arma e informe a munição que sobrou.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isStaff }}\">\n        \n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- WEAPON -->\n  <sc-if value=\"{{ isWeapon }}\">\n    <div style=\"flex:1;display:flex;overflow:hidden\">\n      <div style=\"flex:1;padding:30px 36px;display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:600;text-transform:uppercase;letter-spacing:.04em\">Escolha o armamento<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px\">\n          <sc-for list=\"{{ weapons }}\" as=\"w\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ w.pick }}\" style=\"border:1px solid {{ w.border }};background:{{ w.bg }};border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;cursor:pointer;opacity:{{ w.opacity }}\">\n              <div style=\"width:118px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px\">\n                <image-slot id=\"{{ w.photoId }}\" shape=\"rect\" fit=\"contain\" src=\"{{ w.photo }}\" style=\"width:118px;height:62px\" placeholder=\"Foto PNG\"><\u002Fimage-slot>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#EA4318;letter-spacing:.08em\">{{ w.slot }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:18px;font-weight:600\">{{ w.name }}<\u002Fdiv>\n                <div style=\"font-size:14px;color:#948E85;margin-top:3px\">{{ w.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right\">\n                <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:600;color:{{ w.priceColor }}\">{{ w.price }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#7A736A;letter-spacing:.08em;text-transform:uppercase\">{{ w.priceNote }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;font-size:13px;color:#7A736A;line-height:1.6\">Uso da arma restrito às raias do stand. A devolução é obrigatória no mesmo dia.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:392px;flex:none;background:#191919;border-left:1px solid #333333;padding:26px 26px;display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between\">\n          <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7A736A\">Mapa do armário<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;display:flex;gap:10px;flex-wrap:wrap\">\n          <sc-for list=\"{{ cabLegend }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:6px\">\n              <div style=\"width:14px;height:4px;border-radius:2px;background:{{ l.color }}\"><\u002Fdiv>\n              <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7A736A\">{{ l.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;height:392px;display:flex;gap:6px;align-items:stretch\">\n          <sc-for list=\"{{ cabModules }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"flex:1;min-width:0;background:#141414;border:1px solid #2E2E2E;borde ;font-size:27px;font-weight:600;text-transform:uppercase;letter-spacing:.04em\">{{ m.name }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:#948E85;margin-top:5px;line-height:1.45\">{{ m.desc }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- CONFIG -->\n      <sc-if value=\"{{ isAdminConfig }}\">\n        <div style=\"flex:1;display:flex;overflow:hidden\">\n          <div style=\"flex:1;padding:26px 30px;display:flex;flex-direction:column;gap:12px;overflow:hidden\">\n            <div style=\"font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7A736A\">Operação<\u002Fdiv>\n            <sc-for list=\"{{ cfgToggles }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ t.toggle }}\" style=\"display:flex;align-items:center;gap:18px;border:1px solid #333333;background:#212121;border-radius:12px;padding:14px 18px;cursor:pointer\">\n                <div style=\"flex:1\">\n                  <div style=\"font-size:16px;font-weight:600\">{{ t.name }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#948E85;margin-top:2px\">{{ t.desc }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width:56px;height:30px;border-radius:999px;background:{{ t.trackBg }};display:flex;align-items:center;padding:3px;box-sizing:border-box;justify-content:{{ t.justify }}\">\n                  <div style=\"width:24px;height:24px;border-radius:50%;background:{{ t.knob }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7A736A;margin-top:6px\">Parâmetros<\u002Fdiv>\n            <sc-for list=\"{{ cfgNumbers }}\" as=\"n\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:18px;border:1px solid #33 Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:12px\">\n              <div sc-camel-on-click=\"{{ testDoors }}\" style=\"height:56px;border-radius:12px;border:1px solid #565656;color:#CFCAC1;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer\" style-hover=\"border-color:#EA4318;color:#EA4318\">Testar travas<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ saveCfg }}\" style=\"height:62px;border-radius:12px;background:#EA4318;color:#1E1E1E;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer\">{{ saveLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- HISTÓRICO -->\n      <sc-if value=\"{{ isAdminHist }}\">\n        <div style=\"flex:1;display:flex;overflow:hidden\">\n          <div style=\"flex:1;padding:22px 26px;display:flex;flex-direction:column;overflow:hidden\">\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ histFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ f.pick }}\" style=\"padding:9px 16px;border-radius:999px;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};font-size:13px;letter-spacing:.06em;cursor:pointer\">{{ f.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:8px;overflow:auto\">\n              <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"7\">\n                <div sc-camel-on-click=\"{{ h.pick }}\" style=\"display:flex;align-items:center;gap:16px;border:1 "margin-top:12px;display:flex;gap:10px;flex-wrap:wrap\">\n              <sc-for list=\"{{ cabLegend }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:6px\">\n                  <div style=\"width:14px;height:4px;border-radius:2px;background:{{ l.color }}\"><\u002Fdiv>\n                  <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7A736A\">{{ l.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;height:352px;display:flex;gap:6px;align-items:stretch\">\n              <sc-for list=\"{{ cabModules }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <div style=\"flex:1;min-width:0;background:#141414;border:1px solid #2E2E2E;border-radius:5px;padding:4px;display:flex;flex-direction:column;gap:3px\">\n                  <sc-for list=\"{{ m.rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                    <div style=\"flex:{{ r.grow }};display:flex;gap:3px;min-height:0\">\n                      <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                        <div style=\"flex:1;min-width:0;border-radius:2px;background:{{ c.bg }};border:1px solid {{ c.border }};box-shadow:{{ c.glow }};display:flex;align-items:flex-start;justify-content:center;padding-top:{{ c.pad }}\">\n                          <div style=\"width:62%;height:3px;border-radius:2px;background:{{ c.bar }}\"><\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                <span style=\"font-size:13px;letter-spacing:.1
